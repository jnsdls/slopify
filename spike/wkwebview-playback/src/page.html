<!doctype html>
<meta charset="utf-8" />
<title>slopify wkwebview spike</title>
<body style="font: 13px monospace; padding: 12px">
  <pre id="out"></pre>
  <script>
    const post = (o) => window.__spikePost(o);
    const out = document.getElementById('out');
    const log = (msg) => {
      out.textContent += msg + '\n';
      post({ t: 'log', msg });
    };
    const TRACK = 'spotify:track:4uLU6hMCjMI75M1A2tKUQC';

    window.onSpotifyWebPlaybackSDKReady = () => {
      log('onSpotifyWebPlaybackSDKReady');
      const player = new Spotify.Player({
        name: 'slopify wkwebview spike',
        getOAuthToken: (cb) => {
          post({ t: 'log', msg: 'getOAuthToken called' });
          cb(window.__SPIKE_TOKEN);
        },
        volume: 0.5,
      });
      for (const ev of ['initialization_error', 'authentication_error', 'account_error', 'playback_error'])
        player.addListener(ev, (e) => post({ t: 'sdk-error', event: ev, message: e && e.message }));
      player.addListener('autoplay_failed', () => post({ t: 'sdk-error', event: 'autoplay_failed', message: '' }));
      player.addListener('ready', ({ device_id }) => post({ t: 'ready', device_id }));
      player.addListener('not_ready', ({ device_id }) => post({ t: 'not_ready', device_id }));
      player.addListener('player_state_changed', (s) => {
        if (!s) return post({ t: 'state', none: true });
        const tr = s.track_window.current_track;
        post({ t: 'state', paused: s.paused, position: s.position, duration: s.duration, track: tr && `${tr.name} / ${tr.artists.map((a) => a.name).join(', ')}` });
        // Mirror slopify's renderer (media-session.ts) so Now Playing gets a fair chance.
        if (navigator.mediaSession && tr) {
          navigator.mediaSession.metadata = new MediaMetadata({ title: tr.name, artist: tr.artists.map((a) => a.name).join(', '), album: tr.album.name });
          navigator.mediaSession.playbackState = s.paused ? 'paused' : 'playing';
        }
      });
      if (navigator.mediaSession) {
        for (const action of ['play', 'pause', 'nexttrack', 'previoustrack']) {
          try {
            navigator.mediaSession.setActionHandler(action, () => {
              post({ t: 'log', msg: `mediaSession action ${action}` });
              if (action === 'play') player.resume();
              else if (action === 'pause') player.pause();
            });
          } catch (e) {
            post({ t: 'log', msg: `setActionHandler ${action} failed: ${e}` });
          }
        }
      }
      setInterval(async () => {
        const s = await player.getCurrentState();
        if (s) post({ t: 'pos', paused: s.paused, position: s.position });
      }, 1000);
      window.spikePause = () => player.pause().then(() => post({ t: 'log', msg: 'sdk pause() resolved' }));
      window.spikeDisconnect = () => player.disconnect();
      player.connect().then((ok) => log('connect ' + ok));
    };
  </script>
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
