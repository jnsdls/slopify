<!doctype html><meta charset="utf-8"><title>slopify spike: liked songs + offset</title>
<body style="font:13px monospace;padding:12px"><pre id="out"></pre>
<script>
// Ticket #14: does spotify:user:<id>:collection play Liked Songs, and does
// playlist context + offset + position_ms resume where asked?
const out = document.getElementById('out');
const log = (...a) => { out.textContent += a.join(' ') + '\n'; window.spike.log(...a); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
let token, player, deviceId, seq = 0, latest = null;

async function api(method, path, body) {
  const r = await fetch(`https://api.spotify.com/v1${path}`, {
    method, headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const text = await r.text();
  log(`  ${method} ${path} ${body ? JSON.stringify(body) : ''} -> ${r.status} ${text.slice(0, 300)}`);
  return { status: r.status, json: text ? (() => { try { return JSON.parse(text); } catch { return null; } })() : null };
}
const play = body => api('PUT', `/me/player/play?device_id=${deviceId}`, body);
const pause = () => api('PUT', `/me/player/pause?device_id=${deviceId}`);

function describe(s) {
  if (!s) return 'no state';
  const t = s.track_window?.current_track;
  return `${s.paused ? 'paused' : 'playing'} ctx=${s.context?.uri} pos=${s.position} track="${t?.name}" (${t?.uri}) ` +
    `prev=[${(s.track_window?.previous_tracks || []).map(x => x.name).join('|')}] next=[${(s.track_window?.next_tracks || []).map(x => x.name).join('|')}]`;
}
// Wait until the SDK reports a playing state matching pred, or time out.
async function settle(pred, ms = 10000) {
  const t0 = Date.now(), since = seq;
  let s = null;
  while (Date.now() - t0 < ms) {
    if (seq > since && latest && pred(latest)) { s = latest; break; }
    await sleep(200);
  }
  if (!s) { s = await player.getCurrentState(); log('  (no fresh matching event, polled state)'); }
  log('  state:', describe(s));
  return s;
}

async function run() {
  log('E1 who am I, and the player state before we touch anything');
  const me = await api('GET', '/me');
  const uid = me.json?.id;
  await api('GET', '/me/player');

  // Offsets are only checkable against an order we can see. Force shuffle off,
  // then use the SDK's own track_window as the reference order.
  async function offsetSuite(label, ctx) {
    log(`${label}: shuffle off, then play with no offset`);
    await api('PUT', `/me/player/shuffle?state=false&device_id=${deviceId}`);
    await play({ context_uri: ctx });
    const s0 = await settle(s => !s.paused && s.position > 0 && s.context?.uri === ctx);
    const st = await api('GET', '/me/player');
    log(`  server says shuffle=${st.json?.shuffle_state} repeat=${st.json?.repeat_state} ctx=${st.json?.context?.uri}`);
    const a = s0?.track_window?.current_track, b = s0?.track_window?.next_tracks?.[0];
    await pause();

    log(`${label}: next track via SDK`);
    await player.nextTrack();
    const s1 = await settle(s => !s.paused && s.track_window?.current_track?.uri !== a?.uri);
    const b2 = s1?.track_window?.current_track;
    log(`  next gave "${b2?.name}", window said "${b?.name}": ${b2?.uri === b?.uri ? 'MATCH' : 'MISMATCH'}`);
    await pause();

    log(`${label}: offset.position 1 + position_ms 30000 (expect "${b?.name}" at ~30000)`);
    await play({ context_uri: ctx, offset: { position: 1 }, position_ms: 30000 });
    const s2 = await settle(s => !s.paused && s.position > 25000);
    log(`  verdict: track ${s2?.track_window?.current_track?.uri === b?.uri ? 'MATCHES' : 'DIFFERS FROM'} index 1 ("${s2?.track_window?.current_track?.name}"), pos=${s2?.position}`);
    await pause();

    log(`${label}: offset.uri of "${a?.name}" + position_ms 15000`);
    await play({ context_uri: ctx, offset: { uri: a?.uri }, position_ms: 15000 });
    const s3 = await settle(s => !s.paused && s.position > 12000);
    log(`  verdict: track ${s3?.track_window?.current_track?.uri === a?.uri ? 'MATCHES' : 'DIFFERS FROM'} "${a?.name}", pos=${s3?.position}`);
    await pause();

    log(`${label}: offset.position 0 again (is the no-offset start deterministic?)`);
    await play({ context_uri: ctx, offset: { position: 0 } });
    const s4 = await settle(s => !s.paused && s.position > 0 && s.position < 10000);
    log(`  verdict: ${s4?.track_window?.current_track?.uri === a?.uri ? 'SAME first track' : 'DIFFERENT first track'} ("${s4?.track_window?.current_track?.name}")`);
    await pause();
  }

  if (location.hash !== '#playlist') await offsetSuite('COLLECTION', `spotify:user:${uid}:collection`);

  log('E5 GET /me/tracks (needs user-library-read; token lacks it)');
  await api('GET', '/me/tracks?limit=5');

  log('E6 find a user-made playlist via search (no scope needed), check the pasted-URL reads');
  const sr = await api('GET', '/search?q=daft%20punk&type=playlist&limit=10');
  // search items carry `items`, not `tracks`, since the February 2026 API changes; null entries are filtered results
  const pl = (sr.json?.playlists?.items || []).filter(Boolean).find(p => p.owner?.id !== 'spotify');
  if (!pl) { log('  no playlist available'); return; }
  log(`  using "${pl.name}" spotify:playlist:${pl.id} owner=${pl.owner?.id} keys=${Object.keys(pl).join(',')}`);
  pl.uri = `spotify:playlist:${pl.id}`;
  await api('GET', `/playlists/${pl.id}?fields=name,uri,owner.id,tracks.total`);
  const items = await api('GET', `/playlists/${pl.id}/tracks?limit=3&fields=total,items(track(name))`);
  log(`  items visible for a playlist we do not own: ${items.json?.items?.length ?? 'none'}`);

  await offsetSuite('PLAYLIST', pl.uri);
}

window.onSpotifyWebPlaybackSDKReady = async () => {
  token = await window.spike.token();
  player = new Spotify.Player({ name: 'slopify spike', getOAuthToken: cb => cb(token), volume: 0.2 });
  for (const ev of ['initialization_error', 'authentication_error', 'account_error', 'playback_error'])
    player.addListener(ev, e => log(ev, JSON.stringify(e)));
  player.addListener('player_state_changed', s => { if (s) { latest = s; seq++; } });
  player.addListener('ready', async ({ device_id }) => {
    deviceId = device_id;
    log('ready device', device_id);
    try { await run(); } catch (e) { log('ERROR', String(e)); }
    log('done');
    window.spike.done();
  });
  log('connect', await player.connect());
};
</script>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
