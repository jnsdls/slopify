[package]
name = "slopify"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
env_logger = "0.11"
futures = "0.3"
gpui = { git = "https://github.com/zed-industries/zed", rev = "76659a55a8c10ed355a070f8764a0b1733e3c115" }
# runtime_shaders compiles the Metal shaders at launch, so building needs no Metal Toolchain.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "76659a55a8c10ed355a070f8764a0b1733e3c115", features = ["font-kit", "runtime_shaders"] }
log = "0.4"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKPreferences", "WKWebView", "WKWebViewConfiguration"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slopify-auth.workspace = true
slopify-spotify.workspace = true
slopify-state.workspace = true
ureq = "3.4"
wry = "0.57"
