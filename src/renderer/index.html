<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://sdk.scdn.co; connect-src 'self' https://*.spotify.com https://*.scdn.co wss://*.spotify.com; img-src 'self' data: https://i.scdn.co https://*.scdn.co https://*.spotifycdn.com; frame-src https://sdk.scdn.co https://*.spotify.com; media-src blob: https://*.scdn.co https://*.spotify.com; style-src 'self' 'unsafe-inline'"
    />
    <title>slopify</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z" /></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z" /></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z" /></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M7.4 8.6L12 13.2l4.6-4.6L18 10l-6 6-6-6z" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5L4 14.2l5 5 12-12-1.4-1.4z" /></symbol>
    </svg>

    <main id="app">
      <section id="player" class="player" hidden>
        <div id="now" class="now">
          <div class="art">
            <img id="art" alt="" hidden />
            <span id="art-empty" class="app-icon" role="img" aria-label="slopify"></span>
          </div>
          <a id="title" class="title ellip" href="#"></a>
          <div id="artists" class="artists ellip"></div>
          <div class="progress-area">
            <div class="progress"><i id="progress-fill"></i></div>
            <div id="times" class="times"><span id="elapsed">0:00</span><span id="total">0:00</span></div>
            <div id="message" class="message ellip" hidden></div>
          </div>
          <div class="transport">
            <button id="play" class="play" type="button" aria-label="Play">
              <svg class="icon"><use id="play-icon" href="#i-play" /></svg>
            </button>
            <button id="next" class="next" type="button" aria-label="Next">
              <svg class="icon"><use href="#i-next" /></svg>
            </button>
          </div>
          <div class="volume">
            <svg class="icon"><use href="#i-volume" /></svg>
            <input id="volume" type="range" min="0" max="100" step="1" value="50" aria-label="Volume" />
          </div>
        </div>

        <div id="picker" class="picker" hidden>
          <ul id="picker-list" class="picker-list" role="listbox"></ul>
          <div class="paste">
            <input id="paste" type="text" placeholder="Paste a playlist link" spellcheck="false" autocomplete="off" />
            <div id="paste-error" class="paste-error" hidden></div>
          </div>
        </div>

        <button id="source-row" class="source-row" type="button" aria-expanded="false">
          <span id="source-thumb" class="thumb">
            <img id="source-img" alt="" hidden />
            <svg class="icon"><use href="#i-heart" /></svg>
          </span>
          <span class="source-text">
            <span class="source-label">Playing from</span>
            <span id="source-name" class="ellip"></span>
          </span>
          <svg class="icon chevron"><use href="#i-chevron" /></svg>
        </button>
      </section>

      <section id="sign-in" class="sign-in" hidden>
        <p id="sign-in-line"></p>
        <button id="sign-in-button" type="button">Sign in with Spotify</button>
      </section>

      <footer class="footer">
        <span class="spotify-logo" role="img" aria-label="Spotify"></span>
        <span class="who">
          <span id="display-name" class="ellip"></span>
          <button id="quit" class="link" type="button">Quit</button>
        </span>
      </footer>
    </main>

    <script type="module" src="./main.ts"></script>
    <!-- defer keeps the SDK behind main.ts, which is a module and so deferred; the SDK calls onSpotifyWebPlaybackSDKReady the moment it runs. -->
    <script defer src="https://sdk.scdn.co/spotify-player.js"></script>
  </body>
</html>
